# Created with Gemini

name: CI & Docs
on:
  push:
    branches:
      - main  # or master

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.11']
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - name: Run Tests
        run: |
          julia --project=@. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.test()'
        # Note: Pkg.test() automatically looks for test/runtests.jl
        # If your entry point is specifically test/tests.jl, use:
        # julia --project=@. test/tests.jl

  docs:
    needs: test # Only build docs if tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Build Documentation
        run: |
          rm -f docs/Manifest.toml
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
            include("docs/make.jl")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/build
          branch: gh-pages